# Render.com blueprint. Optional — you can also just create a Web Service
# through the Render dashboard using the settings shown in DEPLOY.md.
services:
  - type: web
    name: pitchkingbackend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: 11hezron72
